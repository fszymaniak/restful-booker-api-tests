name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '3.1.x'
  SOLUTION_PATH: 'RestfulBooker.sln'
  TEST_PROJECT: 'RestfulBooker.ApiTests/RestfulBooker.ApiTests.csproj'

jobs:
  smoke-tests:
    name: Smoke Tests (Quick Validation)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@v3
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }}

    - name: Build solution
      run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

    - name: Run smoke tests
      run: dotnet test ${{ env.TEST_PROJECT }} --configuration Release --no-build --filter "Category=Smoke" --logger "console;verbosity=detailed"
      continue-on-error: false

  build-and-test:
    name: Build & Full Test Suite
    runs-on: ubuntu-latest
    needs: smoke-tests
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@v3
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }}

    - name: Build solution
      run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

    - name: Run all tests with coverage
      run: |
        dotnet test ${{ env.TEST_PROJECT }} \
          --configuration Release \
          --no-build \
          --logger "trx;LogFileName=test-results.trx" \
          --logger "console;verbosity=detailed" \
          --collect:"XPlat Code Coverage" \
          --results-directory ./coverage

    - name: Generate coverage report
      if: always()
      run: |
        dotnet tool install -g dotnet-reportgenerator-globaltool
        reportgenerator \
          -reports:"./coverage/**/coverage.cobertura.xml" \
          -targetdir:"./coverage/report" \
          -reporttypes:"HtmlInline_AzurePipelines;Cobertura;Badges"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results
        path: ./coverage/**/*.trx

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report
        path: ./coverage/report/

    - name: Comment PR with coverage
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          try {
            const coveragePath = './coverage/report/Cobertura.xml';
            if (fs.existsSync(coveragePath)) {
              const coverage = fs.readFileSync(coveragePath, 'utf8');
              const match = coverage.match(/line-rate="([0-9.]+)"/);
              if (match) {
                const percentage = (parseFloat(match[1]) * 100).toFixed(2);
                github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: `### 📊 Code Coverage Report\n\n**Line Coverage:** ${percentage}%\n\n[View detailed coverage report in artifacts](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
                });
              }
            }
          } catch (error) {
            console.log('Could not post coverage comment:', error);
          }

  regression-tests:
    name: Regression Test Suite
    runs-on: ubuntu-latest
    needs: smoke-tests
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@v3
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }}

    - name: Build solution
      run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

    - name: Run regression tests
      run: |
        dotnet test ${{ env.TEST_PROJECT }} \
          --configuration Release \
          --no-build \
          --filter "Category=Regression" \
          --logger "trx;LogFileName=regression-results.trx" \
          --logger "console;verbosity=detailed"

    - name: Upload regression test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: regression-test-results
        path: ./RestfulBooker.ApiTests/TestResults/**/*.trx

  integration-tests:
    name: Integration Test Suite
    runs-on: ubuntu-latest
    needs: smoke-tests
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@v3
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }}

    - name: Build solution
      run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

    - name: Run integration tests
      env:
        RESTFUL_BOOKER_URL: ${{ secrets.RESTFUL_BOOKER_URL || 'https://restful-booker.herokuapp.com' }}
        TEST_ENVIRONMENT: CI
      run: |
        dotnet test ${{ env.TEST_PROJECT }} \
          --configuration Release \
          --no-build \
          --filter "Category=Integration" \
          --logger "trx;LogFileName=integration-results.trx" \
          --logger "console;verbosity=detailed"

    - name: Upload integration test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: integration-test-results
        path: ./RestfulBooker.ApiTests/TestResults/**/*.trx

  publish-test-results:
    name: Publish Test Results
    runs-on: ubuntu-latest
    needs: [build-and-test, regression-tests, integration-tests]
    if: always()

    steps:
    - name: Download all test results
      uses: actions/download-artifact@v3
      with:
        path: ./test-results

    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: |
          ./test-results/**/*.trx
        check_name: Test Results
        comment_title: Test Results Summary

    - name: Test Report Summary
      if: always()
      run: |
        echo "### 📋 Test Execution Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ All test suites completed" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "View detailed results in the artifacts above." >> $GITHUB_STEP_SUMMARY
